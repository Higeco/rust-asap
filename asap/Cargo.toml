[package]
name = "asap"
readme = "../README.md"
version = "0.9.0"
license = "MIT"
edition = "2018"
authors = [
  "Callum Osmotherly <cosmotherly@atlassian.com>",
  "Robin Stocker <rstocker@atlassian.com>",
  "Antoine Büsch <abusch@atlassian.com>",
  "Sam Reis <sreis@atlassian.com>",
]
keywords = ["asap", "jwt", "api", "token", "authorisation"]
homepage = "https://bitbucket.org/atlassianlabs/rust-asap/"
repository = "https://bitbucket.org/atlassianlabs/rust-asap/"
description = "An implementation of ASAP for rust."

[dependencies]
bytes = "0.5.6"
chrono = "0.4.15"
failure = "0.1.8"
failure_derive = "0.1.8"
jsonwebtoken = "7.2.0"
lru_time_cache = "0.10.0"
pem = "0.8.1"
rand = "0.7.3"
reqwest = "0.10.7"
serde = "1.0.115"
serde_derive = "1.0.115"
serde_json = "1.0.57"

[dev-dependencies]
base64 = "0.12.3"
bencher = "0.1.5"
# Currently publishing this as a separate crate.
# https://github.com/rust-lang/cargo/issues/4242
asap_deps_keyserver = { path = "support/keyserver", version = "0.2.0" }
tokio = { version = "0.2.22", features = ["full"] }

[[bench]]
name = "tokens"
harness = false

