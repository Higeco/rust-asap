[package]
name = "asap"
readme = "../README.md"
version = "0.7.0"
license = "MIT"
authors = [
  "Callum Osmotherly <cosmotherly@atlassian.com>",
  "Robin Stocker <rstocker@atlassian.com>",
  "Antoine Büsch <abusch@atlassian.com>",
  "Sam Reis <sreis@atlassian.com>",
]
keywords = ["asap", "jwt", "api", "token", "authorisation"]
homepage = "https://bitbucket.org/atlassianlabs/rust-asap/"
repository = "https://bitbucket.org/atlassianlabs/rust-asap/"
description = "An implementation of ASAP for rust."

[dependencies]
chrono = "0.4"
failure = "0.1.1"
failure_derive = "0.1.1"
jsonwebtoken = "4"
lru_time_cache = "0.8.1"
pem = "0.5.0"
rand = "0.5"
reqwest = "0.8.6"
serde = "1"
serde_derive = "1"
serde_json = "1"

[dev-dependencies]
base64 = "0.10.0"
bencher = "0.1.5"
# Currently publishing this as a separate crate.
# https://github.com/rust-lang/cargo/issues/4242
asap_deps_keyserver = { path = "support/keyserver", version = "0.1.0" }

[[bench]]
name = "tokens"
harness = false

