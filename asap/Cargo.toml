[package]
name = "asap"
readme = "../README.md"
version = "0.12.0-hig"
license = "MIT"
edition = "2018"
authors = [
  "Callum Osmotherly <cosmotherly@atlassian.com>",
  "Robin Stocker <rstocker@atlassian.com>",
  "Antoine Büsch <abusch@atlassian.com>",
  "Sam Reis <sreis@atlassian.com>",
]
keywords = ["asap", "jwt", "api", "token", "authorisation"]
homepage = "https://bitbucket.org/atlassianlabs/rust-asap/"
repository = "https://bitbucket.org/atlassianlabs/rust-asap/"
description = "An implementation of ASAP for rust."

[features]
fips = ["jsonwebtoken-aws-lc", "aws-lc-rs/fips"]
http-keyserver = ["dep:reqwest"]
pem = ["dep:pem", "jsonwebtoken/use_pem", "jsonwebtoken-aws-lc/use_pem"]
default = ["jsonwebtoken", "http-keyserver", "pem"]

[dependencies]
bytes = "1.1.0"
chrono = "0.4"
anyhow = "1.0"
thiserror = "2"
jsonwebtoken = { version = "9.3", optional = true, default-features = false }
jsonwebtoken-aws-lc = { version = "9.3", optional = true, default-features = false }
lru_time_cache = "0.11.11"
pem = { version = "1.0.2", optional = true }
rand = "0.9.2"
reqwest = { version = "0.11.9", optional = true }
serde = "1.0.136"
serde_derive = "1.0.136"
serde_json = "1.0.78"
aws-lc-rs = { version = "1.8.1", optional = true }
derive_more = { version = "2.0.1", features = ["display"] }

[dev-dependencies]
base64 = "0.13.0"
bencher = "0.1.5"
# Currently publishing this as a separate crate.
# https://github.com/rust-lang/cargo/issues/4242
asap_deps_keyserver = { path = "support/keyserver", version = "0.3.0" }
tokio = { version = "1.16.1", features = ["full"] }

[[bench]]
name = "tokens"
harness = false
