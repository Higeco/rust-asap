image: rust:latest

pipelines:
  default:
    - step:
        script:
          - echo "Build project"; cargo build
          - echo "Installing nightly toolchain"; rustup toolchain install nightly
          - echo "Building test keyserver"; cargo +nightly build -p keyserver
          - echo "Starting test keyserver"; cargo +nightly run -p keyserver > /dev/null 2>&1 &
          - echo "Waiting for keyserver to start"; sleep 5
          - echo "Running tests"; ./support/test.sh
