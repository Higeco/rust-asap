[package]
name = "asap_cli"
readme = "../README.md"
version = "0.3.0"
license = "MIT"
edition = "2018"
authors = [
  "Callum Osmotherly <cosmotherly@atlassian.com>",
  "Robin Stocker <rstocker@atlassian.com>",
  "Antoine Büsch <abusch@atlassian.com>",
  "Sam Reis <sreis@atlassian.com>",
]
keywords = ["asap", "jwt", "api", "token", "authorisation"]
homepage = "https://bitbucket.org/atlassianlabs/rust-asap/"
repository = "https://bitbucket.org/atlassianlabs/rust-asap/"
description = "A helpful command line utility for using ASAP."

[dependencies]
asap = { path = "../asap", version = "0.10.0" }
clap = { version = "3.0.14", features = ["derive"] }
directories = "4.0.1"
human-panic = "1.0.3"
anyhow = "1.0"
thiserror = "1.0"
pem = "1.0.2"
serde = "1.0.136"
serde_json = "1.0.78"
serde_derive = "1.0.136"

[[bin]]
name = "asap"
path = "src/main.rs"
