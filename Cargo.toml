[workspace]
members = ["support/keyserver"]

[package]
name = "asap"
readme = "README.md"
version = "0.2.1"
license = "MIT"
authors = ["acheronfail <acheronfail@gmail.com>"]
keywords = ["asap", "jwt", "api", "token", "authorisation"]
homepage = "https://bitbucket.org/acheronfail/rust-asap/"
repository = "https://bitbucket.org/acheronfail/rust-asap/"
description = "An implementation of ASAP for rust."

[dependencies]
jsonwebtoken = "4"
serde = "1"
serde_json = "1"
serde_derive = "1"
chrono = "0.4"
reqwest = "0.8.6"
openssl = "0.10"
failure = "0.1.1"
failure_derive = "0.1.1"
