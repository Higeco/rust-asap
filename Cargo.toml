[workspace]
members = [
  "asap-cli",
  "support/keyserver"
]

[package]
name = "asap"
readme = "README.md"
version = "0.4.0"
license = "MIT"
authors = [
  "Callum Osmotherly <cosmotherly@atlassian.com>",
  "Robin Stocker <rstocker@atlassian.com>",
  "Antoine Büsch <abusch@atlassian.com>",
  "Sam Reis <sreis@atlassian.com>",
]
keywords = ["asap", "jwt", "api", "token", "authorisation"]
homepage = "https://bitbucket.org/atlassianlabs/rust-asap/"
repository = "https://bitbucket.org/atlassianlabs/rust-asap/"
description = "An implementation of ASAP for rust."

[dependencies]
chrono = "0.4"
failure = "0.1.1"
failure_derive = "0.1.1"
jsonwebtoken = "4"
pem = "0.5.0"
rand = "0.5"
reqwest = "0.8.6"
serde = "1"
serde_json = "1"
serde_derive = "1"

[dev-dependencies]
bencher = "0.1.5"
keyserver = { path = "support/keyserver" }

[[bench]]
name = "tokens"
harness = false
